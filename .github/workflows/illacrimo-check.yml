name: Check Illacrimo theme

on:
  push:
    branches:
      - illacrimo-theme-rebuild
  pull_request:
    branches:
      - illacrimo-theme-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Astro type check
        run: npm run check
      - name: Build site
        run: npm run build
