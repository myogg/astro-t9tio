name: Illacrimo Preview

on:
  push:
    branches:
      - illacrimo-theme-rebuild
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: illacrimo-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Preview build passed, but deployment is waiting for CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy isolated preview Worker
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name astro-t9tio-preview

      - name: Write deployment status
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.credentials.outputs.ready }}" == "true" && "${{ job.status }}" == "success" ]]; then
            echo "Preview Worker deployment completed. Expected URL: https://astro-t9tio-preview.xxjss.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.credentials.outputs.ready }}" != "true" ]]; then
            echo "Build passed. Deployment is waiting for the two Cloudflare repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Preview build or deployment failed. Check the logs above." >> "$GITHUB_STEP_SUMMARY"
          fi
